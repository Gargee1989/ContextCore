<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Context Core settings</title>
	<style>
		:root { color: #17211b; background: #f8f7f1; font: 14px/1.45 Georgia, serif; }
		body { width: 320px; margin: 0; padding: 20px; }
		h1 { margin: 0; color: #35644a; font: 700 21px/1.1 Georgia, serif; }
		.intro { margin: 7px 0 20px; color: #667066; }
		label { display: block; margin: 14px 0 6px; color: #39483c; font: 600 11px Arial, sans-serif; letter-spacing: .06em; text-transform: uppercase; }
		input { width: 100%; padding: 9px 10px; border: 1px solid #c6c9bb; border-radius: 5px; background: #fffef9; color: #17211b; font: 13px Arial, sans-serif; }
		input:focus { outline: 2px solid #9bb8a0; outline-offset: 1px; }
		button { width: 100%; margin-top: 18px; padding: 10px; border: 0; border-radius: 5px; background: #35644a; color: white; cursor: pointer; font: 700 12px Arial, sans-serif; }
		.note { margin: 15px 0 0; color: #667066; font-size: 12px; }
		#status { min-height: 18px; margin-top: 9px; color: #35644a; font: 12px Arial, sans-serif; }
	</style>
</head>
<body>
	<h1>Context Core</h1>
	<p class="intro">Select a word while reading to see what it means in context.</p>
	<form id="settings-form">
		<label for="endpoint">Lookup endpoint</label>
		<input id="endpoint" type="url" placeholder="https://your-api.example/define" autocomplete="url">
		<label for="api-key">API key <span>(optional)</span></label>
		<input id="api-key" type="password" placeholder="Stored locally in Chrome" autocomplete="off">
		<button type="submit">Save settings</button>
		<div id="status" role="status" aria-live="polite"></div>
	</form>
	<p class="note">Without an endpoint, Context Core uses a local demo response. API keys are stored in Chrome local storage and are not encrypted.</p>
	<script src="content.js"></script>
</body>
</html>
