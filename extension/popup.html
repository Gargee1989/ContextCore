<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ContentCore Settings</title>
	<style>
		* { box-sizing: border-box; }
		body { font: 14px Arial, sans-serif; width: 360px; margin: 0; padding: 16px; background: #f8f7f1; color: #17211b; }
		h1 { font: 18px/1.2 Arial, sans-serif; color: #35644a; margin: 0 0 16px; }
		label { display: block; margin-top: 12px; font-weight: 600; color: #35644a; }
		input { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #c6c9bb; border-radius: 4px; font: 13px Arial, sans-serif; }
		button { width: 100%; padding: 10px; margin-top: 16px; background: #35644a; color: white; border: none; border-radius: 4px; cursor: pointer; font: 600 13px Arial, sans-serif; }
		button:hover { background: #2d5239; }
		#status { margin-top: 12px; padding: 8px; border-radius: 4px; font-size: 12px; display: none; }
		#status.success { background: #d4edda; color: #155724; display: block; }
		#status.error { background: #f8d7da; color: #721c24; display: block; }
		.info { margin-top: 12px; padding: 8px; background: #e7f3ff; color: #004085; border-radius: 4px; font-size: 12px; line-height: 1.4; }
		.reader-link { display: block; margin-top: 12px; color: #35644a; font-size: 12px; text-align: center; }
	</style>
</head>
<body>
	<h1>ContentCore Settings</h1>
	<form id="settings-form">
		<label for="endpoint">LLM API Endpoint (HTTPS):</label>
		<input type="url" id="endpoint" placeholder="https://api.example.com/explain" required>

		<label for="api-key">API Key:</label>
		<input type="password" id="api-key" placeholder="Enter your API key">

		<button type="submit">Save Settings</button>
		<div id="status"></div>
	</form>
	<a class="reader-link" href="pdf-viewer.html" target="_blank">Open ContentCore PDF Reader</a>

	<div class="info">
		<strong>How it works:</strong>
		<ul style="margin: 8px 0; padding-left: 18px;">
			<li>Highlight any word on a webpage</li>
			<li>Use the PDF Reader link for PDF files</li>
			<li>Click "Explain" to get AI-powered definitions</li>
			<li>Saved words available in your reading history</li>
		</ul>
	</div>

	<script src="popup.js"></script>
</body>
</html>
